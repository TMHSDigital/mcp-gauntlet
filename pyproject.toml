[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-gauntlet"
dynamic = ["version"]
description = "A deliberately hostile MCP server for testing whether your agent follows instructions it should not."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TMHSDigital" }]
keywords = ["mcp", "model-context-protocol", "security", "prompt-injection", "red-team", "agents", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11"]

[project.scripts]
mcp-gauntlet = "mcp_gauntlet.cli:main"

[project.urls]
Homepage = "https://tmhsdigital.github.io/mcp-gauntlet/"
Repository = "https://github.com/TMHSDigital/mcp-gauntlet"
Issues = "https://github.com/TMHSDigital/mcp-gauntlet/issues"
Changelog = "https://github.com/TMHSDigital/mcp-gauntlet/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "mcp_gauntlet.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_gauntlet = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
